[package]
name = "quick-noise-benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
quick-noise = { path = ".." }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fastnoise2 = "0.4.0"
fastnoise-lite = "1.1.1"
noise = "0.9.0"
libnoise = "1.2.0"
noiz = "0.5.0"
simdnoise = "3.1.6"
bevy_math = "0.19.0"
noise-functions = "0.8.5"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = false

[profile.bench]
opt-level = 3
debug = "line-tables-only"
strip = false

[[bench]]
name = "perlin"
harness = false

[[bench]]
name = "value"
harness = false

[[bench]]
name = "simplex"
harness = false

[[bench]]
name = "cellular"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "batch"
harness = false
