name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 16777216

jobs:
  x86:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scalar
            rustflags: ""
          - name: sse
            rustflags: "-C target-feature=+sse,+sse2,+sse3,+sse4.1,+sse4.2"
          - name: avx2
            rustflags: "-C target-feature=+avx,+avx2,+fma"
          - name: avx512
            rustflags: "-C target-feature=+avx512f,+avx512bw,+avx512vl,+avx512dq"
    steps:
      - uses: actions/checkout@v4

      - name: Install target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build (${{ matrix.name }})
        run: cargo build -p quick-noise --verbose --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUST_MIN_STACK: 16777216

      - name: Check AVX-512 support
        if: matrix.name == 'avx512'
        id: cpu
        run: |
          if grep -qm1 avx512f /proc/cpuinfo; then
            echo "has_avx512=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_avx512=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (${{ matrix.name }})
        if: matrix.name != 'avx512'
        run: cargo test -p quick-noise --verbose --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUST_MIN_STACK: 16777216

      - name: Test (avx512)
        if: matrix.name == 'avx512' && steps.cpu.outputs.has_avx512 == 'true'
        run: cargo test -p quick-noise --verbose --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUST_MIN_STACK: 16777216

  arm-neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build (neon)
        run: cargo build -p quick-noise --verbose --target aarch64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-C target-feature=+neon"
          RUST_MIN_STACK: 16777216

      - name: Test (neon)
        run: cargo test -p quick-noise --verbose --target aarch64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-C target-feature=+neon"
          RUST_MIN_STACK: 16777216
