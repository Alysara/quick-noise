[workspace]
resolver = "3"
members = [".", "quick-noise-benches"]

[package]
name = "quick-noise"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alysara/quick-noise"
keywords = ["noise", "simd", "simplex", "perlin", "performance"]
categories = ["game-engines", "multimedia::images"]
readme = "README.md"
description = "Blazingly fast SIMD procedural noise library for batch and uniform grid sampling with runtime feature detection on stable Rust"
rust-version = "1.95"
exclude = ["images/"]

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = false

[profile.bench]
opt-level = 3
debug = "line-tables-only"
strip = false

[dependencies]
itertools = "0.14.0"
simply-simd = { git = "https://github.com/Alysara/simply-simd" }
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_arrays = { version = "0.2", optional = true }

[dev-dependencies]
paste = "1.0.15"

[features]
image = ["dep:image"]
serde = ["dep:serde", "dep:serde_arrays"]

[[example]]
name = "basic"
required-features = ["image"]

[[example]]
name = "debug"
required-features = ["image"]

[[example]]
name = "test_images"
required-features = ["image"]
